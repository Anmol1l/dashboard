<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
            <div class="search-bar">
                
                <label for="search">
                    <a href="#"><img src="images-and-icons/icons/search.svg" alt="Search" width="25px" height="25px"></a>
                </label>
                <input type="search" name="search" id="search">
            </div>

            <div class="account-info">

                <div class="notification-bell">
                        <a href="#"><img src="images-and-icons/icons/notification.svg" alt="notification" width="25px" height="25px"></a>
                </div>

                <div class="profile-photo">
                    <a href="#"><img src="images-and-icons/images/batman.jpg" alt="profile"></a>
                </div>

                <div class="name">
                    <p>Batman</p>
                </div>
            </div>

            <div class="personal-info">
                <div class="personal-info-profile">
                    <img src="images-and-icons/images/batman.jpg" alt="">
                </div>

                <div class="personal-info-text">
                    <p>Hi there,</p>
                    <h2>Batman (@bruce)</h2>
                </div>
            </div>

            <div class="post-options">
                <ul>
                    <li><a href="#">News</a></li>
                    <li><a href="#">Upload</a></li>
                    <li><a href="#">Share</a></li>
                </ul>
            </div>

    </header>

    <section>
        side
    </section>
    <main>
        main
    </main>
</body>

</html>
