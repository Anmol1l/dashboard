<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <div class="search-bar">

            <label for="search">
                <a href="#"><img src="images-and-icons/icons/search.svg" alt="Search" width="25px" height="25px"></a>
            </label>
            <input type="search" name="search" id="search">
        </div>

        <div class="account-info">

            <div class="notification-bell">
                <a href="#"><img src="images-and-icons/icons/notification.svg" alt="notification" width="25px"
                        height="25px"></a>
            </div>

            <div class="profile-photo">
                <a href="#"><img src="images-and-icons/images/batman.jpg" alt="profile"></a>
            </div>

            <div class="name">
                <p>Batman</p>
            </div>
        </div>

        <div class="personal-info">
            <div class="personal-info-profile">
                <img src="images-and-icons/images/batman.jpg" alt="">
            </div>

            <div class="personal-info-text">
                <p>Hi there,</p>
                <h2>Batman (@bruce)</h2>
            </div>
        </div>

        <div class="post-options">
            <ul>
                <li><a href="#">News</a></li>
                <li><a href="#">Upload</a></li>
                <li><a href="#">Share</a></li>
            </ul>
        </div>

    </header>

    <section>

        <div class="sidebar">

            <div class="dashboard">
                <a href="#">
                    <img src="images-and-icons/icons/dashboard.svg" alt="dash-icon">
                    <p>Dashboard</p>
                </a>
            </div>

            <nav class="navigation">

                <div class="home">
                    <a href="#">
                        <img src="images-and-icons/icons/home.svg" alt="home-icon">
                        <p>Home</p>
                    </a>
                </div>

                <div class="profile">
                    <a href="#">
                        <img src="images-and-icons/icons/profile.svg" alt="home-icon">
                        <p>Profile</p>
                    </a>
                </div>

                <div class="messages">
                    <a href="#">
                        <img src="images-and-icons/icons/message.svg" alt="msg-icon">
                        <p>Messages</p>
                    </a>
                </div>

                <div class="history">
                    <a href="#">
                        <img src="images-and-icons/icons/history.svg" alt="msg-icon">
                        <p>History</p>
                    </a>
                </div>

                <div class="tasks">
                    <a href="#">
                        <img src="images-and-icons/icons/tasks.svg" alt="msg-icon">
                        <p>Tasks</p>
                    </a>
                </div>

                <div class="communities">
                    <a href="#">
                        <img src="images-and-icons/icons/communities.svg" alt="msg-icon">
                        <p>Communities</p>
                    </a>
                </div>

            </nav>

            <nav class="settings-section">

                <div class="settings">
                    <a href="#">
                        <img src="images-and-icons/icons/settings.svg" alt="msg-icon">
                        <p>Settings</p>
                    </a>
                </div>

                <div class="support">
                    <a href="#">
                        <img src="images-and-icons/icons/support.svg" alt="msg-icon">
                        <p>Support</p>
                    </a>
                </div>

                <div class="Privacy">
                    <a href="#">
                        <img src="images-and-icons/icons/privacy.svg" alt="msg-icon">
                        <p>Privacy</p>
                    </a>
                </div>

            </nav>



        </div>
    </section>
    <main>


        main
    </main>
</body>

</html>
